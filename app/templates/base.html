<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Mercado Libre Flex → SimpliRoute{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f172a'/%3E%3Cpath d='M9 11l3 8 4-12 4 12 3-8' stroke='%2334d399' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    body { font-feature-settings: 'cv11', 'ss01'; }
    .dot { width: .5rem; height: .5rem; border-radius: 9999px; display: inline-block; }
    .dot-ok   { background: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.18); }
    .dot-warn { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.18); }
    .dot-err  { background: #f43f5e; box-shadow: 0 0 0 3px rgba(244,63,94,.18); }
    .dot-idle { background: #94a3b8; box-shadow: 0 0 0 3px rgba(148,163,184,.18); }
  </style>
</head>
<body class="font-sans bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col">

<header class="border-b border-slate-200 bg-white/80 backdrop-blur sticky top-0 z-10">
  <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3 group">
      <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-slate-900 text-emerald-400">
        <svg viewBox="0 0 32 32" class="w-5 h-5"><path d="M9 11l3 8 4-12 4 12 3-8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div>
        <div class="text-sm font-semibold leading-tight">Mercado Libre Flex → SimpliRoute</div>
        <div class="text-xs text-slate-500 leading-tight">Automated visit creation</div>
      </div>
    </a>
    <nav class="hidden sm:flex items-center gap-1 text-sm">
      <a href="/" class="px-3 py-1.5 rounded-md hover:bg-slate-100 text-slate-600 hover:text-slate-900 transition">Overview</a>
      <a href="/status" class="px-3 py-1.5 rounded-md hover:bg-slate-100 text-slate-600 hover:text-slate-900 transition">Status</a>
      <a href="/docs" class="px-3 py-1.5 rounded-md hover:bg-slate-100 text-slate-600 hover:text-slate-900 transition">API docs</a>
      <a href="/health" class="px-3 py-1.5 rounded-md hover:bg-slate-100 text-slate-600 hover:text-slate-900 transition font-mono text-xs">/health</a>
    </nav>
  </div>
</header>

<main class="flex-1">
  <div class="max-w-5xl mx-auto px-6 py-10">
    {% block content %}{% endblock %}
  </div>
</main>

<footer class="border-t border-slate-200 bg-white">
  <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between text-xs text-slate-500">
    <span>v1.0.0 · Python · FastAPI · PostgreSQL</span>
    <span class="font-mono">{{ now }}</span>
  </div>
</footer>

</body>
</html>
